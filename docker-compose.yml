version: "3"

services:
  db:
    image: mysql:8.0
    restart: always   # Giữ MySQL luôn chạy
    ports:
      - "3315:3306"
    volumes:
      - /db_signage/:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro

    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "cms"
      MYSQL_ROOT_USER: "root"
      TZ: "Asia/Ho_Chi_Minh"


  xmr:
    image: ghcr.io/xibosignage/xibo-xmr:develop
    restart: always   # Giữ XMR luôn chạy
    ports:
      - "9505:9505"
    environment:
      XMR_DEBUG: "true"
      IPV6PUBSUPPORT: "false"
      TZ: "Asia/Ho_Chi_Minh"


  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: always   # Giữ Web Server luôn chạy
    volumes:
      - ./:/var/www/cms
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "81:80"
    environment:
      CMS_DEV_MODE: "false"
      MYSQL_DATABASE: "cms"
      TZ: "Asia/Ho_Chi_Minh"


  memcached:
    image: memcached:alpine
    restart: always   # Giữ Memcached luôn chạy
    command: memcached -m 15
    volumes:
      - /etc/localtime:/etc/localtime:ro


  swagger:
    image: swaggerapi/swagger-ui:latest
    restart: always   # Giữ Swagger luôn chạy
    ports:
      - "8080:8080"
    environment:
      - API_URL=http://localhost/swagger.json


  quickchart:
    volumes:
      - /etc/localtime:/etc/localtime:ro
    image: ianw/quickchart
    restart: always   # Giữ QuickChart luôn chạy