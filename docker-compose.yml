version: "3"

services:
  db:
    image: mysql:8.0
    restart: always
    ports:
      - "3315:3306"
    volumes:
      - db_signage:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cms}
      MYSQL_USER: ${MYSQL_USER:-cms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cms_pass}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      timeout: 5s

  xmr:
    image: ghcr.io/xibosignage/xibo-xmr:develop
    restart: always
    depends_on:
      - db
    ports:
      - "9505:9505"
    environment:
      XMR_DEBUG: "true"
      IPV6PUBSUPPORT: "false"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
      - xmr
    volumes:
      - ./:/var/www/cms
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "81:80"
    environment:
      CMS_DEV_MODE: ${CMS_DEV_MODE:-false}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cms}
      MYSQL_USER: ${MYSQL_USER:-cms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cms_pass}
      TZ: "Asia/Ho_Chi_Minh"

  memcached:
    image: memcached:alpine
    restart: always
    command: memcached -m 15

  swagger:
    image: swaggerapi/swagger-ui:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      API_URL: "http://localhost/swagger.json"

  quickchart:
    image: ianw/quickchart
    restart: always

volumes:
  db_signage:
