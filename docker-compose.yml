version: "3"

services:
  db:
    image: mysql:8.0
    restart: always
    ports:
      - "3315:3306"
    volumes:
      - ./db/:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
      - ./init_triggers.sh:/docker-entrypoint-initdb.d/init_triggers.sh
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "cms"
      MYSQL_USER: "cms"         # Thêm dòng này
      MYSQL_PASSWORD: "root"    # Thêm dòng này
      TZ: "Asia/Ho_Chi_Minh"



  xmr:
    image: ghcr.io/xibosignage/xibo-xmr:develop
    restart: always   # Giữ XMR luôn chạy
    ports:
      - "9505:9505"
    environment:
      XMR_DEBUG: "true"
      IPV6PUBSUPPORT: "false"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always   # Giữ Web Server luôn chạy
    volumes:
      - ./:/var/www/cms
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "81:80"
    environment:
      CMS_DEV_MODE: "false"
      MYSQL_DATABASE: "cms"
      TZ: "Asia/Ho_Chi_Minh"
      MYSQL_PASSWORD: "root"
      MYSQL_USER: "root"
      MYSQL_HOST: "db"


  memcached:
    image: memcached:alpine
    restart: always   # Giữ Memcached luôn chạy
    command: memcached -m 15

  swagger:
    image: swaggerapi/swagger-ui:latest
    restart: always   # Giữ Swagger luôn chạy
    ports:
      - "8080:8080"
    environment:
      - API_URL=http://localhost/swagger.json

  quickchart:
    image: ianw/quickchart
    restart: always   # Giữ QuickChart luôn chạy
